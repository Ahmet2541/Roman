version: "3.9"

# Kullanım: docker compose up -d
# Önce .env dosyanı hazırla (./init_env.sh) ve DATABASE_URL'i şu satırla değiştir:
#   DATABASE_URL=postgresql://roman:${POSTGRES_PASSWORD}@db:5432/roman
# (Postgres container'a "db" servis adıyla bağlanılır, "localhost" ile DEĞİL.)

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: roman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: roman
    volumes:
      - roman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roman"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://roman:${POSTGRES_PASSWORD}@db:5432/roman
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups

volumes:
  roman_pgdata:
