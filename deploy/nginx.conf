# Nginx reverse proxy yapılandırması - Roman Yazım Asistanı
#
# Kurulum (Ubuntu VPS örneği):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/roman
#   # Aşağıdaki "senin-domainin.com" kısmını gerçek domain'inle değiştir
#   sudo ln -s /etc/nginx/sites-available/roman /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d senin-domainin.com   # HTTPS sertifikası otomatik kurar

server {
    listen 80;
    server_name senin-domainin.com;

    # Certbot bu satırı otomatik HTTPS yönlendirmesine çevirecek

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dosya yükleme (içe aktarma) ve AI istekleri uzun sürebilir
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }
}
