<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş — Roman Yazım Asistanı</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--ink-900); }
  .login-card {
    background: var(--paper); border-radius: 12px; padding: 36px 34px; width: 340px;
  }
  .login-card h1 { font-family: var(--font-display); font-size: 22px; margin: 0 0 4px; }
  .login-card p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 24px; }
  .login-card .field { margin-bottom: 16px; }
  .login-card button { width: 100%; padding: 10px; }
</style>
</head>
<body>
  <form class="login-card" id="loginForm">
    <h1>Roman Yazım Asistanı</h1>
    <p class="sub">Devam etmek için giriş yap</p>
    <div class="field">
      <label>Kullanıcı adı</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">Giriş yap</button>
    <div id="error" class="error-text"></div>
  </form>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
